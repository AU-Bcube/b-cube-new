<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF 뷰어</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            background: #0b1026;
            overflow: auto;
            scrollbar-width: none;
        }
        /* 스크롤은 되고 바만 숨긴다 (scrollbar-width를 모르는 사파리용) */
        ::-webkit-scrollbar { display: none; }
        #pdf-viewer {
            width: 100%;
            min-height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px 0;
            gap: 12px;
        }
        canvas {
            display: block;
            max-width: 100%;
            height: auto;
            border-radius: 4px;
            box-shadow: 0 2px 16px rgba(0,0,0,0.4);
        }
        #loading {
            color: rgba(255,255,255,0.5);
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 14px;
            padding: 40px;
            text-align: center;
        }
        #error {
            color: rgba(255,100,100,0.7);
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 14px;
            padding: 40px;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>
    <div id="loading">PDF를 불러오는 중...</div>
    <div id="error">PDF를 불러올 수 없습니다.</div>
    <div id="pdf-viewer"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const url = urlParams.get('pdfUrl');

        if (url) {
            pdfjsLib.getDocument(url).promise.then(pdfDoc => {
                document.getElementById('loading').style.display = 'none';
                const viewer = document.getElementById('pdf-viewer');
                const total = pdfDoc.numPages;

                // 화면에 가장 많이 보이는 페이지를 모달 머리줄(1 / N)에 알린다
                const canvases = [];
                let current = 0;
                const update = () => {
                    let best = 1, most = 0;
                    canvases.forEach((c, i) => {
                        const r = c.getBoundingClientRect();
                        const visible = Math.min(r.bottom, innerHeight) - Math.max(r.top, 0);
                        if (visible > most) { most = visible; best = i + 1; }
                    });
                    if (best !== current) {
                        current = best;
                        parent.postMessage({ type: 'pdf-page', page: best, total }, location.origin);
                    }
                };
                document.addEventListener('scroll', () => requestAnimationFrame(update), { capture: true, passive: true });

                for (let pageNum = 1; pageNum <= total; pageNum++) {
                    // 페이지 순서가 섞이지 않게 캔버스를 먼저 순서대로 붙이고, 불러오면 그린다
                    const canvas = document.createElement('canvas');
                    viewer.appendChild(canvas);
                    canvases.push(canvas);

                    pdfDoc.getPage(pageNum).then(page => {
                        const viewport = page.getViewport({ scale: 1.5 });
                        canvas.height = viewport.height;
                        canvas.width = viewport.width;
                        page.render({ canvasContext: canvas.getContext('2d'), viewport: viewport });
                        update();
                    });
                }
            }).catch(() => {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
            });
        } else {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error').style.display = 'block';
        }
    </script>
</body>
</html>
